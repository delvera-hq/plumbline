# Path 2. A Director's brief becomes a ranked list of task issues, run one at a time.
# 1. plan: a Director labels an issue `brief`. The planner (one Claude call, no tools) assesses it and lists up to
#    5 small tasks. Plain code checks the list.
# 2. create: the tasks become issues, the brief gets the plan as a comment, and the first task starts.
# 3. next: when an agent PR merges, its issue closes and the next task starts. This keys on the merge, not on the
#    issue closing, because GitHub doesn't close linked issues when the App merges. A task closed as not planned
#    stops the chain.
# Tasks start through agent.yml's workflow_dispatch, which accepts github-actions only for a task that links to a
# Director's brief. Set the repo variable AUTO_START to false to stop it all.
name: brief
on:
  issues:
    types: [labeled, closed]
  pull_request:
    types: [closed]
    branches: [main]
permissions: {}
concurrency:
  group: brief-chain # One at a time, so two closes can't start two tasks.
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.action == 'labeled' && github.event.label.name == 'brief' && vars.AUTO_START != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: agent-llm # Holds only the Anthropic key, and is limited to main.
    permissions:
      contents: read
      issues: read
    outputs:
      ok: ${{ steps.plan.outputs.ok }}
      cost: ${{ steps.plan.outputs.cost_usd_est }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check who asked, and save the brief as a data file
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          SENDER: ${{ github.event.sender.login }}
          ALLOW: ${{ vars.AGENT_TRIGGER_ALLOWLIST }}
        run: |
          set -euo pipefail
          jq -en --argjson allow "$ALLOW" --arg s "$SENDER" '$allow | index($s) != null' > /dev/null
          gh api "repos/$REPO/issues/$ISSUE" > "$RUNNER_TEMP/issue.json"
          jq -e --argjson allow "$ALLOW" '.user.login as $u | $allow | index($u) != null' "$RUNNER_TEMP/issue.json" > /dev/null
          jq -r '"# \(.title)\n\n\(.body // "")"' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/brief.md"
      - name: Install the Anthropic SDK, with no key in reach
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check "anthropic==1.17.0"
      - id: plan
        name: The planner assesses the brief and lists tasks
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLANNER_MODEL: ${{ vars.PLANNER_MODEL }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -I .github/agent/planner.py plan --brief "$RUNNER_TEMP/brief.md" --repo-dir . \
            --out "$RUNNER_TEMP/plan.json" | tee "$RUNNER_TEMP/plan.out"
          jq '{plan, problems}' "$RUNNER_TEMP/plan.json"
          grep -E '^(ok|tasks|cost_usd_est)=' "$RUNNER_TEMP/plan.out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan.json
          retention-days: 7

  create:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Only for the run-log branch.
      issues: write
      actions: write # To start agent.yml. A workflow_dispatch is the one event GITHUB_TOKEN may start.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/agent/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - name: Write the tasks as issues, comment the plan, and start the first task
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRIEF: ${{ github.event.issue.number }}
          OK: ${{ needs.plan.outputs.ok }}
          COST: ${{ needs.plan.outputs.cost || '0' }}
          TENANT: ${{ vars.TENANT || 'internal' }}
          PROJECT: ${{ vars.PROJECT || github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          PLAN="$RUNNER_TEMP/plan/plan.json"
          NUMBERS=""
          if [ "$OK" = "true" ]; then
            python3 -I .github/agent/planner.py issues --plan "$PLAN" --brief-number "$BRIEF" --out-dir "$RUNNER_TEMP/issues"
            TOTAL=$(jq '.plan.tasks | length' "$PLAN")
            for n in $(seq 1 "$TOTAL"); do
              URL=$(gh issue create --title "$(cat "$RUNNER_TEMP/issues/$n.title")" --body-file "$RUNNER_TEMP/issues/$n.md")
              NUMBERS="$NUMBERS ${URL##*/}"
            done
            python3 -I .github/agent/planner.py summary --plan "$PLAN" --numbers "$NUMBERS" > summary.md
            printf '\nPlanner cost about $%s. Run: %s\n' "$COST" "$RUN_URL" >> summary.md
            gh issue comment "$BRIEF" --body-file summary.md
            FIRST=$(awk '{print $1}' <<<"$NUMBERS")
            gh workflow run agent.yml --ref main -f issue="$FIRST"
            RESULT=planned
          else
            {
              echo "**The planner didn't make a plan.** Edit the brief, then remove and re-add the \`brief\` label."
              echo
              jq -r '.problems[]? | "- " + .' "$PLAN" | sed 's/@/(at)/g'
              printf '\nRun: %s\n' "$RUN_URL"
            } > refusal.md
            gh issue comment "$BRIEF" --body-file refusal.md
            RESULT=not_planned
          fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg e brief_planned --arg t "$TENANT" --arg p "$PROJECT" --arg b "$BRIEF" --arg r "$RESULT" \
            --arg tasks "$NUMBERS" --arg cost "$COST" --arg at "$NOW" \
            '{schema_version:1,event:$e,tenant:$t,project:$p,issue:$b,result:$r,tasks:($tasks|split(" ")|map(select(.!=""))),
              planner_cost_usd_est:($cost|tonumber? // 0),at:$at}' > event.json
          gh api -X PUT "repos/$GH_REPO/contents/events/${NOW%%T*}/brief-$BRIEF-$GITHUB_RUN_ID.json" \
            -f branch=run-log -f message="log: brief $BRIEF $RESULT" -f content="$(base64 -w0 event.json)" > /dev/null \
            || echo "::warning::Couldn't write the run log"

  next:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged == true && vars.AUTO_START != 'false'
      && startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # gh workflow run reads the default branch.
      issues: write
      actions: write
    steps:
      - name: Close the task, then start the next one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          ALLOW: ${{ vars.AGENT_TRIGGER_ALLOWLIST }}
        run: |
          set -euo pipefail
          ISSUE=$(sed -nE 's#^agent/issue-([0-9]+)-.*#\1#p' <<<"$HEAD_REF")
          [ -n "$ISSUE" ] || { echo "No issue in $HEAD_REF."; exit 0; }
          gh api "repos/$GH_REPO/issues/$ISSUE" > closed.json
          if [ "$(jq -r .state closed.json)" = "open" ]; then
            # GITHUB_TOKEN's close starts no workflow, so this can't also fire the stop job below.
            gh issue close "$ISSUE" --reason completed --comment "Done in #$PR."
          fi
          BRIEF=$(jq -r '.body // ""' closed.json | sed -nE 's/^Brief: #([0-9]+)$/\1/p' | head -1)
          STEP=$(jq -r '.body // ""' closed.json | sed -nE 's/^Step: ([0-9]+) of ([0-9]+)$/\1 \2/p' | head -1)
          [ -n "$BRIEF" ] && [ -n "$STEP" ] || { echo "Not a brief task."; exit 0; }
          read -r K M <<<"$STEP"
          gh api "repos/$GH_REPO/issues/$BRIEF" > brief.json
          jq -e --argjson allow "$ALLOW" '(.user.login as $u | $allow | index($u) != null) and ([.labels[].name] | index("brief") != null)' brief.json > /dev/null \
            || { echo "::error::#$BRIEF isn't a Director's brief"; exit 1; }
          if [ "$K" -ge "$M" ]; then
            gh issue comment "$BRIEF" --body "All $M tasks are done. The last was #$ISSUE."
            gh issue close "$BRIEF" --reason completed
            exit 0
          fi
          WANT=$((K + 1))
          gh api --paginate --slurp "repos/$GH_REPO/issues?state=open&per_page=100" > open.json
          # Whole lines only, so "Brief: #1" never matches "Brief: #12".
          NEXT=$(jq -r --arg b "Brief: #$BRIEF" --arg s "Step: $WANT of $M" '
            [.[][] | select(.pull_request == null and .user.login == "github-actions[bot]")
              | select((.body // "") | split("\n") | (index($b) != null and index($s) != null)) | .number][0] // empty' open.json)
          if [ -z "$NEXT" ]; then
            gh issue comment "$BRIEF" --body "Step $K of $M (#$ISSUE) is done, but I can't find step $WANT open, so the chain stopped."
            exit 0
          fi
          gh workflow run agent.yml --ref main -f issue="$NEXT"
          gh issue comment "$BRIEF" --body "Step $K of $M (#$ISSUE) is done. Started step $WANT, #$NEXT."

  stopped:
    # A person closed a task without merging it. The chain stops here.
    if: >-
      github.event_name == 'issues' && github.event.action == 'closed' && github.event.issue.state_reason != 'completed'
      && github.event.issue.user.login == 'github-actions[bot]' && contains(github.event.issue.body, 'Brief: #')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Say the chain stopped
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          REASON: ${{ github.event.issue.state_reason }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          BRIEF=$(sed -nE 's/^Brief: #([0-9]+)\r?$/\1/p' <<<"$BODY" | head -1)
          [ -n "$BRIEF" ] || exit 0
          gh issue comment "$BRIEF" --body "Task #$ISSUE closed as $REASON, so the chain stopped. Start a task by hand with the \`agent:go\` label, or write a new brief."
