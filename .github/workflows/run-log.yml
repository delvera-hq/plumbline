# Path 1. Records PRs closing, and posts a weekly summary issue. Neither job runs code from a PR.
name: run-log
on:
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions: {}

jobs:
  pr-closed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write # Only for the run-log branch. Its pushes trigger no workflow, as they use GITHUB_TOKEN.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }} # main's writer, never the PR's.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/agent/run_log.py
      - name: Write the event
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          BODY: ${{ github.event.pull_request.body }}
          TENANT: ${{ vars.TENANT || 'internal' }}
          PROJECT: ${{ vars.PROJECT || github.event.repository.name }}
        run: |
          set -uo pipefail
          # An agent PR names its run, and the event joins to it. A person's PR has none, so it's this run.
          RUN_ID=$(grep -oE '^run_id: run_[0-9]+_[0-9]+' <<<"$BODY" | head -1 | cut -d' ' -f2) || RUN_ID=""
          python3 -I .github/agent/run_log.py emit --type pr.closed --name "pr-$PR-pr.closed-$GITHUB_RUN_ID" \
            --run-id "${RUN_ID:-run_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}}" \
            --int pr="$PR" --bool merged="$MERGED" --set merged_by="$MERGED_BY" --set sha="$SHA"

  summary:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/agent/
            /.github/standards/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: run-log
          path: log
          persist-credentials: false
      - name: Check this week's events against event.v1
        uses: ./.github/standards # A public repo can't use the private action, so it runs its pinned copy.
        continue-on-error: true # The summary still goes out, and says the check didn't run.
        with:
          check: events
          events-dir: log/events
          report: ${{ runner.temp }}/event-check.md
      - name: Post the summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -I .github/agent/run_log_summary.py --events log/events --repo "$GH_REPO" \
            --extra "$RUNNER_TEMP/event-check.md" > summary.md
          gh issue create --title "Weekly run summary, $(date -u +%Y-%m-%d)" --body-file summary.md
