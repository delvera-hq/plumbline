# Path 1. The required check. It holds no secrets, and it calls the tools directly, so a PR can't redefine them
# through package.json scripts.
name: ci
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false # v5 caches by default, and calls pnpm before it's installed.
      - run: npm install --global "pnpm@$(jq -r '.packageManager | split("@")[1]' package.json)"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec biome check .
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

  # Path 11. Every event name and field, label, topic and project value must be in delvera-hq/org-standards.
  # It reads files as data and runs nothing from the PR. A failure prints the exact entry to add there.
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read # To list the repo's live labels.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A public repo can't use the private org-standards action. It runs the pinned copy from the base branch, so a
      # PR can't change the check that checks it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .standards-base
          persist-credentials: false
          sparse-checkout: .github/standards
      - name: Use this PR's copy only if the base branch has none yet
        run: |
          if [ ! -f .standards-base/.github/standards/action.yml ]; then
            echo "::warning::The base branch has no copy of org-standards yet, so this PR's own copy runs. That happens once, on the PR that adds it."
            mkdir -p .standards-base/.github && cp -R .github/standards .standards-base/.github/standards
          fi
      - uses: ./.standards-base/.github/standards
