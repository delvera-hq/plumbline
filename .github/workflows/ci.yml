# Path 1. The required check. It holds no secrets, and it calls the tools directly, so a PR can't redefine them
# through package.json scripts.
name: ci
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - run: npm install --global "pnpm@$(jq -r '.packageManager | split("@")[1]' package.json)"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec biome check .
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
