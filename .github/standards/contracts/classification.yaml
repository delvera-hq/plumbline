# Every project group and facet value. names.py fails on a record or a repo topic that uses one that isn't here.
# Groups are lineage: the one project family a repo is a version or part of. Facets classify, and hold several values.
# Add a value in the same change set as the work that needs it, with its meaning. A renamed value keeps its old one in
# `aliases`. A value only one repo uses is a sign it's too fine. Design: migration-design.md, section 16.
# Each value becomes a GitHub topic: <topic_prefix><value>, such as group-ember or form-mobile-app.
version: "1.0.0"
updated: "2026-11-13"

