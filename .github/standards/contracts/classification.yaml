facets:
  domain:
    topic_prefix: domain-
    meaning: What field the project is in. Set by a Director.
    values:
      biotech: {meaning: "Biology, life sciences and their research tools."}
      finance: {meaning: "Trading, investing and markets. Brings in the trading controls."}
      food-drink: {meaning: "Food, drink and dining."}
      social: {meaning: "Social apps and content."}
      sport: {meaning: "Sport and fitness."}
      travel: {meaning: "Travel and places."}
      recruiting: {meaning: "Hiring and careers."}
      events: {meaning: "Events and life occasions."}
      commerce: {meaning: "Shopping, products and prices."}
      advertising: {meaning: "Ads and marketing."}
      developer-tools: {meaning: "Tools for software and AI builders."}
      research-tools: {meaning: "Tools for research and knowledge work."}
      company: {meaning: "Delvera's own presence and operations."}
  form:
    topic_prefix: form-
    meaning: What shape the project is. Proposed by the inventory, confirmed by a Director. A project with apps on several platforms has several values.
    values:
      mobile-app: {meaning: "An iPhone or Android app."}
      web-app: {meaning: "A site or app served in a browser."}
      desktop-app: {meaning: "A macOS, Windows or Linux app."}
      api: {meaning: "A service whose product is its API."}
      service: {meaning: "A deployed backend or worker that isn't mainly an API."}
      library: {meaning: "Code imported by other code, published or not."}
      cli: {meaning: "A command-line tool."}
      agent: {meaning: "An AI agent or a set of agents."}
      pipeline: {meaning: "A data job: collect, transform and load."}
      infra: {meaning: "Infrastructure as code."}
      notebook: {meaning: "Mostly notebooks and analysis."}
      docs: {meaning: "Writing and notes only."}
      empty: {meaning: "Nearly no content. Recorded and archived, with nothing to port."}
  capability:
    topic_prefix: cap-
    meaning: What the project does technically. Proposed at triage, confirmed by a Director.
    values:
      llm: {meaning: "Calls a large language model. Brings in cost caps and evals."}
      agents: {meaning: "Runs multi-step agents with tools."}
      retrieval: {meaning: "Search or retrieval over documents."}
      scraping: {meaning: "Collects data from other sites."}
      optimization: {meaning: "Solves optimization problems."}
      ml-model: {meaning: "Trains or serves its own ML model."}
      simulation: {meaning: "Simulates a system."}
      knowledge-graph: {meaning: "Builds or queries a graph of entities."}
  audience:
    topic_prefix: audience-
    meaning: Who the project is for. Set by a Director.
    values:
      consumer: {meaning: "The public."}
      business: {meaning: "Companies and their staff."}
      researchers: {meaning: "Scientists and researchers."}
      internal: {meaning: "Delvera's own use."}
  stack:
    topic_prefix: stack-
    meaning: What the project is built with. Written by the inventory from its facts, never by hand.
    values:
      python: {meaning: "Python."}
      typescript: {meaning: "TypeScript."}
      javascript: {meaning: "JavaScript, when there's no TypeScript."}
      flutter: {meaning: "Flutter and Dart."}
      swift: {meaning: "Swift, for native Apple code."}
      kotlin: {meaning: "Kotlin, for native Android code."}
      rust: {meaning: "Rust."}
      go: {meaning: "Go."}
      c: {meaning: "C."}
      cpp: {meaning: "C++."}
      java: {meaning: "Java."}
      astro: {meaning: "Astro."}
      jupyter: {meaning: "Jupyter notebooks."}
      terraform: {meaning: "Terraform (HCL)."}
      postgres: {meaning: "PostgreSQL code in the repo."}
      neo4j: {meaning: "Neo4j (Cypher)."}
      firebase: {meaning: "Hosted or deployed on Firebase."}
      docker: {meaning: "Built or run with Docker."}
      github-pages: {meaning: "Served by GitHub Pages."}
